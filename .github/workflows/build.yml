name: Compilar Kernel Vayu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Compilar Kernel Android
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: '.'
          kernel-dir: '.'
          config: vayu_defconfig
          arch: arm64
          clang-version: r416183b
          disable-lto: true
          anykernel3: true
          ksu: false
